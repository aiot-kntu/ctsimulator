# First nineteen-node trial: 32-round window and N-1 replays. Halts early.
seed = 1
phy_mode = "ci"
protocol = "unanimous_pipeline"
num_proposals = 3000
snapshot_interval = 100000000
max_slots = 100000000

[network]
num_nodes = 19
topology = "full_mesh"   # the testbed was a single radio cell
loss_rate = 0.0

[ci]
flood_repeats = 3        # BlueFlood: initiator in slot 0, relays until slot 3
round_slots = 4

[hw]
ack_window = 32
max_replays = 18
# Per-board whole-flood loss (index i = board N(i+1)), measured in the run.
node_flood_loss = [0.000000, 0.000000, 0.000000, 0.002107, 0.000000, 0.003090, 0.000000, 0.002528, 0.000281, 0.000000, 0.001405, 0.000000, 0.000140, 0.000000, 0.000140, 0.000000, 0.001405, 0.000000, 0.000000]
trace_csv = "results/trace_n19_w32_first_trial.csv"
